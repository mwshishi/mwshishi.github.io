<div class="yt-topbar" aria-label="Global music player">
  <button id="yt-play" class="yt-btn" aria-label="Play">▶</button>
  <button id="yt-pause" class="yt-btn" aria-label="Pause">⏸</button>
  <button id="yt-next" class="yt-btn" aria-label="Next">⏭</button>
  <span id="yt-now">Now playing: press play</span>

  <div id="yt-player" aria-hidden="true"></div>
</div>
